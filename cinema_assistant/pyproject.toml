[project]
name = "cinema-assistant"
version = "0.1.0"
description = "Demo didattica di Function Calling con OpenAI e Chainlit"
authors = [
    {name = "Mattia"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "chainlit>=2.0,<3.0",
    "openai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0"
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
